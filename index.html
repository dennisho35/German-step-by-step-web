<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Step by Step</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c0392b'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle' font-family='Arial'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* ===== 設計 tokens（忠實還原日語國際版參考站） ===== */
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --ink:#1E293B; --muted:#64748B;
  --line:#E2E8F0; --navy:#1B365D; --accent:#D64045; --amber:#F59E0B;
  --ok:#15803d; --shadow:0 2px 10px rgba(15,23,42,.05); --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    "Noto Sans","Noto Sans CJK SC","PingFang HK","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Malgun Gothic",
    "Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55; min-height:100vh;
}
html[data-locale="ja-JP"] body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif}
html[data-locale="ko-KR"] body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
html[data-locale="th-TH"] body{font-family:Tahoma,"Noto Sans Thai","Sarabun",sans-serif}
html[data-locale="my-MM"] body{font-family:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif}
html[data-locale="km-KH"] body{font-family:"Noto Sans Khmer","Khmer OS",sans-serif}
html[data-locale="zh-HK"] body{font-family:"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif}
html[data-locale="ru-RU"] body,html[data-locale="uk-UA"] body{font-family:"Noto Sans","Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%}

/* ===== Header（深藍頂欄，參考站風格） ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;border:1px solid rgba(255,255,255,.25)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#fff;font-weight:700;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;white-space:nowrap}
.navtabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.navtab{padding:6px 11px;border-radius:999px;color:#dbe2ef;font-size:.82rem;font-weight:600;white-space:nowrap;flex:none}
.navtab.active{background:var(--amber);color:#1E293B;font-weight:700}
.navtab:hover{background:rgba(255,255,255,.14);color:#fff}
.navtab.active:hover{background:var(--amber)}
.navwrap{display:flex;align-items:center;gap:8px;min-width:0}

/* ===== 語言選擇器 ===== */
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.86rem;font-weight:600;white-space:nowrap}
.lang-btn:hover{background:#fff8ee}
.lang-menu{position:absolute;right:0;top:calc(100%+8px);min-width:230px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:100}
.lang-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:.9rem;text-align:left}
.lang-opt:hover{background:var(--bg)}
.lang-opt.active{background:#fdeee2;font-weight:700}
.lang-opt .flag{font-size:1.1rem}
.lang-opt .native{flex:1}
.lang-opt .code{color:var(--muted);font-size:.75rem}

/* ===== 內容容器 ===== */
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 72px}

/* ===== Hero ===== */
.hero{padding:30px 0 8px}
.hero h1{margin:0 0 8px;font-size:1.9rem;line-height:1.2;letter-spacing:-.02em}
.hero p{margin:0 0 18px;color:var(--muted);font-size:1.02rem;max-width:60ch}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}

/* ===== 卡片 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g-2{grid-template-columns:1fr}
@media(min-width:560px){.g-2{grid-template-columns:1fr 1fr}}

/* ===== 每日目標 / 進度 ===== */
.daily{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
.goals{display:flex;gap:6px}
.goal{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:600}
.goal.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{height:9px;background:#eee6d3;border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--accent));border-radius:999px;transition:width .3s}
.metric{font-size:.86rem;color:var(--muted)}

/* ===== 進度摘要 ===== */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sum-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.sum-item b{display:block;font-size:1.5rem;color:var(--accent)}
.sum-item span{font-size:.78rem;color:var(--muted)}

/* ===== 模組 ===== */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-head h2{margin:0;font-size:1.25rem}
.section-head .sub{color:var(--muted);font-size:.9rem}
.module{padding:18px}
.module .icon{font-size:1.9rem;display:block;margin-bottom:6px}
.module h3{margin:0 0 4px;font-size:1.1rem}
.module p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.module .cta{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:.92rem}
.module.soon{opacity:.55;filter:grayscale(.4)}
.soon-badge{display:inline-block;margin-top:8px;font-size:.75rem;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:999px}

/* ===== 字母卡網格 ===== */
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(min-width:520px){.abc-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.letter-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--shadow);transition:transform .1s,box-shadow .15s;position:relative}
.letter-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.10)}
.letter-card .ch{font-size:2.4rem;font-weight:800;line-height:1.1}
.letter-card .nm{font-size:.86rem;color:var(--muted);margin-top:4px}
.letter-card .ipa{font-size:.78rem;color:var(--accent);font-family:Georgia,"Times New Roman",serif;margin-top:2px}
.letter-card .hint{font-size:.82rem;color:var(--amber);margin-top:2px}
.letter-card .spk{margin-top:8px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#fdeee2;color:var(--accent);font-size:.8rem;font-weight:700}
.status-dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
.status-dot.learned{background:var(--ok)}
.status-dot.new{background:#d5d0c2}
.status-dot.mastered{background:var(--amber)}

/* ===== 詳情視圖 ===== */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;margin:20px 0 14px;padding:6px 10px;border-radius:10px}
.back:hover{background:#fdeee2}
.detail-card{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:600px){.detail-card{grid-template-columns:160px 1fr}}
.detail-char{display:flex;align-items:center;justify-content:center;font-size:6.5rem;font-weight:800;color:var(--accent);background:var(--surface);border:2px solid var(--line);border-radius:var(--r);min-height:180px}
.detail-facts{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.detail-facts .lbl{color:var(--muted);font-weight:600}
.detail-facts .ipa{color:var(--accent);font-weight:700;font-family:Georgia,serif}
.speak-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.speak{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.speak.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.banner-error{background:#fdecea;border:1px solid #f5c2bb;color:#b3261e;border-radius:12px;padding:11px 14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.hidden{display:none}

@media(min-width:768px){
  .hero{padding:40px 0 10px}
  .hero h1{font-size:2.4rem}
}

:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 列表卡片（文法/會話） ===== */
.list-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);cursor:pointer}
.list-card:hover{border-color:#cdd6e0}
.list-card .ic{font-size:1.4rem;flex:none}
.list-card .body{min-width:0;flex:1}
.list-card .t{font-weight:700}
.list-card .d{font-size:.82rem;color:var(--muted)}
.list-card .chev{color:var(--accent);font-weight:800}
.list{display:grid;gap:10px}

/* ===== 文法詳情 / 對話詳情 ===== */
.lesson-block{margin-top:14px}
.lesson-block h3{font-size:1rem;margin:0 0 6px;color:var(--navy)}
.lesson-block p{margin:0;color:#374151}
.gpoint{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:8px}
.gpoint .de{font-weight:700}
.gpoint .gl{color:var(--muted);font-size:.86rem}
.dline{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.dline .n{color:var(--accent);font-weight:800;flex:none}
.dline .de{font-weight:700}
.dline .gl{color:var(--muted);font-size:.86rem}

/* ===== 測驗 ===== */
.quiz-wrap{max-width:640px}
.qstem{font-weight:700;font-size:1.05rem;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:.96rem}
.opt:hover{border-color:#b8c2cf}
.opt.correct{background:#ecf8ee;border-color:var(--ok)}
.opt.wrong{background:#fdecea;border-color:var(--accent)}
.qexpl{margin-top:14px;background:#f3f5f7;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem}
.quiz-score{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.score-chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600}

/* ===== 六大區塊 ===== */
.blocks{display:grid;gap:10px;margin-top:16px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.blk .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.blk .h .st{font-size:.75rem;color:var(--muted);font-weight:600}
.blk.done{border-color:#bcd9c3}
.blk.done .h .st{color:var(--ok)}

/* ===== A9 畫布 ===== */
.canvas-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctool{padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600}
.ctool.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.canvas-box{position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
#handwritingCanvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair;background:#fff}
.reference-glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;color:#e6e2d8;pointer-events:none;user-select:none}
.canvas-msg{margin-top:10px;font-size:.86rem;color:var(--muted)}

/* ===== 統計 / 設定 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat-tile b{display:block;font-size:1.4rem;color:var(--accent)}
.stat-tile span{font-size:.78rem;color:var(--muted)}
.review-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.review-item .de{font-weight:700;flex:1}
.srs-hint{font-size:.84rem;color:var(--muted);margin-top:6px}
.reset-btn{margin-top:16px;padding:9px 14px;border-radius:10px;background:#fdecea;color:var(--accent);border:1px solid #f5c2bb;font-weight:700}
/* ---- 新增視圖共用樣式（與 JS 產出對應） ---- */
.lc-title{font-weight:700;font-size:.98rem}
.lc-sub{font-size:.84rem;color:var(--muted);margin-top:2px}
.dline{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.dline.de{font-weight:700}
.dline.mean{color:var(--muted);font-size:.86rem;border-style:dashed}
.gpoint .dline.de{font-weight:700}
.blk-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.blk-num{background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;flex:none}
.blk-check{color:var(--ok);font-weight:800;margin-left:auto}
.blk .dline.de{display:block}
.dial-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.dial-line .spk{font-weight:800;color:var(--accent)}
.spk.small{padding:5px 9px;font-size:.8rem}
.cta.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn-block{display:block;width:100%;text-align:center;margin-top:12px}
.qtext{font-size:1.02rem;font-weight:700;margin:10px 0 4px}
.opt-list{margin-top:6px}
.opt:disabled{cursor:default;opacity:.9}
.qfeedback{margin-top:10px;font-weight:700;padding:8px 12px;border-radius:10px}
.qfeedback.ok{background:#ecf8ee;color:#157347}
.qfeedback.no{background:#fdecea;color:var(--accent)}
.quiz-intro,.quiz-result{text-align:center}
.score-big{font-size:2rem;font-weight:800;color:var(--accent)}
.lesson-block .lbl{font-weight:700;margin-bottom:4px}
.empty-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-size:.86rem;color:var(--muted);cursor:default}

/* ===== Numbers module ===== */
.num-settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.num-settings .lbl{font-weight:700;font-size:.85rem;color:var(--navy);margin-right:4px}
.spd-btn{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;cursor:pointer}
.spd-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tgl-chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.tgl-chip.on{background:#ecf8ee;border-color:var(--ok);color:var(--ok)}
.converter-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.converter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.converter-row input,.converter-row select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;flex:1;min-width:140px}
.converter-row input:focus,.converter-row select:focus{outline:3px solid var(--amber);outline-offset:2px}
.conv-result{margin-top:14px;padding:14px;background:#fdf6ec;border-left:4px solid var(--amber);border-radius:8px;font-size:1.1rem;font-weight:700;color:var(--navy);line-height:1.6}
.conv-result .de-word{font-size:1.25rem;color:var(--accent)}
.conv-rule{margin-top:10px;font-size:.86rem;color:var(--muted);line-height:1.5}
.num-cat{margin-bottom:22px}
.num-cat-head{font-size:1.05rem;font-weight:700;color:var(--navy);margin:18px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.num-cat-note{font-size:.84rem;color:var(--muted);margin-bottom:10px;line-height:1.5}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.num-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:box-shadow .15s}
.num-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.num-card .n{font-size:1.3rem;font-weight:800;color:var(--accent)}
.num-card .de{font-size:1rem;font-weight:700;margin-top:2px}
.num-card .ipa{font-size:.78rem;color:var(--navy);font-family:Georgia,serif}
.num-card .tr{font-size:.82rem;color:var(--muted);margin-top:2px}
.num-card .num-spk{margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:#fdeee2;color:var(--accent);font-size:.78rem;font-weight:700}
.num-detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none}
.num-card.open .num-detail{display:block}
.num-detail .ex-de{font-size:.86rem;font-weight:600;margin-top:4px}
.num-detail .ex-tr{font-size:.82rem;color:var(--muted)}
.num-detail .ex-spk{margin-top:4px;display:inline-block}
.measure-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.measure-grid{grid-template-columns:1fr 1fr}}
.measure-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.measure-card .de{font-weight:700;font-size:1rem}
.measure-card .art{font-size:.82rem;color:var(--accent);font-weight:600}
.measure-card .ipa{font-size:.78rem;color:var(--navy);font-family:Georgia,serif}
.measure-card .tr{font-size:.84rem;color:var(--muted)}
.measure-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.measure-card.open .measure-detail{display:block}
.scen-badge{display:inline-block;font-size:.72rem;font-weight:700;background:var(--navy);color:#fff;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.play-all-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.dd-line{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.dd-line .spk-tag{font-weight:800;color:var(--accent)}
.dd-line .de-text{font-weight:700;margin:4px 0}
.dd-line .ipa-text{font-size:.8rem;color:var(--navy);font-family:Georgia,serif}
.dd-line .tr-text{font-size:.86rem;color:var(--muted)}

</style>
</head>
<body>
<div id="app">

  <!-- ===== 頂部導航（深藍頂欄） ===== -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <img class="logo" id="logoImg" alt="" src="">
      <span class="brand-name" id="brandName">German Step by Step</span>
    </div>
    <div class="spacer"></div>
    <div class="navwrap">
      <nav class="navtabs" id="navTabs" aria-label="main"></nav>
      <span class="chip" id="streakChip">🔥 0</span>

/* ---- 安全儲存包裝：localStorage 不可用時仍可瀏覽 ---- */
var storageOK = true;
function storeGet(key){ try{ return window.localStorage.getItem(key);}catch(e){ storageOK=false; return null; } }
function storeSet(key,val){ try{ window.localStorage.setItem(key,val);}catch(e){ storageOK=false; } }

/* ---- 今日日期字串 (YYYY-MM-DD, 本地) ---- */
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  var p=dateStr.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---- 語言偵測：白名單驗證 + 裝置語言 + 儲存優先 ---- */
function detectLocale(){
  var saved = storeGet('gss.language');
  if(saved && LOCALES.some(function(l){return l.code===saved;})) return saved;
  var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
  for(var i=0;i<langs.length;i++){
    var t = (langs[i]||'').toLowerCase().replace('_','-');
    if(/^zh-(hk|tw)/.test(t) || /zh-hant/.test(t)) return 'zh-HK';
    if(/^fr/.test(t)) return 'fr-FR';
    if(/^ja/.test(t)) return 'ja-JP';
    if(/^ko/.test(t)) return 'ko-KR';
    if(/^th/.test(t)) return 'th-TH';
    if(/^vi/.test(t)) return 'vi-VN';
    if(/^my/.test(t)) return 'my-MM';
    if(/^id/.test(t)) return 'id-ID';
    if(/^km/.test(t)) return 'km-KH';
    if(/^es/.test(t)) return 'es-ES';
    if(/^ru/.test(t)) return 'ru-RU';
    if(/^uk/.test(t)) return 'uk-UA';
    if(/^it/.test(t)) return 'it-IT';
    if(/^fil|^tl/.test(t)) return 'fil-PH';
    if(/^de/.test(t)) return 'de-DE';
    if(/^en/.test(t)) return 'en-GB';
  }
  return 'en-GB';
}

/* ---- 載入持久化狀態 ---- */
function loadState(){
  try{
    var p = storeGet('gss.progress');
    if(p){ var obj=JSON.parse(p); if(obj && typeof obj==='object') PROGRESS=obj; }
    var g = storeGet('gss.goal');
    if(g && /^(5|10|15|30)$/.test(g)) dailyGoal = +g;
    var sd = storeGet('gss.studied');
    if(sd){ var o=JSON.parse(sd)||{}; studiedToday = (o && o[todayStr()])?o[todayStr()]:0; }
    var sc = storeGet('gss.streak');

    var srs = storeGet('gss.srs');

    var bl = storeGet('gss.blocks');

/* ---- 連續天數更新 ---- */
function bumpStreak(){
  var today=todayStr();
  if(studiedToday<=0) return;
  if(streakLast===today){ /* 今日已記 */ }
  else if(streakLast===addDays(today,-1)){ streakCount+=1; }
  else { streakCount=1; }
  streakLast=today;
}

/* ---- SRS：等級與間隔（1→4） ---- */
function srsInterval(lv){ return [1,3,7,14][Math.min(3,Math.max(0,lv-1))]; }
function srsGet(id){ return SRS[id]||{lv:1,next:''}; }
function srsRecord(id, correct){
  var cur=srsGet(id); var lv=cur.lv;
  if(correct){ lv=Math.min(4,lv+1); } else { lv=1; }
  SRS[id]={lv:lv, next:addDays(todayStr(), srsInterval(lv))};
}
function srsDue(){
  var t=todayStr(); var out=[];
  for(var k in SRS){ if(SRS[k].next && SRS[k].next<=t) out.push(k); }
  return out;
}

/* ---- 進度計算 ---- */
function progressStats(){
  var learned=0, mastered=0;
  ALPHABET.forEach(function(L){
    var s=PROGRESS[L.id]&&PROGRESS[L.id].status;
    if(s==='learned'||s==='mastered') learned++;
    if(s==='mastered') mastered++;
  });
  var pct = ALPHABET.length? Math.round(learned/ALPHABET.length*100):0;
  return {learned:learned, mastered:mastered, pct:pct};
}
function letterStatus(id){ return (PROGRESS[id]&&PROGRESS[id].status)||'new'; }

/* ---- 標記學習 ---- */
function markLearned(id){
  var st=letterStatus(id);
  if(st==='new'){
    PROGRESS[id]={status:'learned', learnedAt:todayStr()};
    studiedToday++;
    bumpStreak();
    persistAll();
    showToast(t('toastLearned'));
  }
}
function toggleMastered(id){
  var st=letterStatus(id);
  var today=todayStr();
  if(st==='mastered'){
    PROGRESS[id]={status:'learned', learnedAt:(PROGRESS[id]&&PROGRESS[id].learnedAt)||today};
  }else{
    if(st==='new'){ studiedToday++; }
    PROGRESS[id]={status:'mastered', learnedAt:(PROGRESS[id]&&PROGRESS[id].learnedAt)||today};
    bumpStreak();
    showToast(t('toastMastered'));
  }
  persistAll();
  renderAll();
}

/* ---- 語音合成：優先 de-DE，字母名稱與例字分開播放 ---- */
var cachedVoice=null;
function pickGermanVoice(){
  if(cachedVoice) return cachedVoice;
  if(!('speechSynthesis' in window)) return null;
  var voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  for(var i=0;i<voices.length;i++){ if(/^de/.test(voices[i].lang||'')){ cachedVoice=voices[i]; return cachedVoice; } }
  return null;
}
function speak(text, inDetail){
  if(!('speechSynthesis' in window)){ speechError(inDetail); return; }
  var v=pickGermanVoice();
  if(!v){
    if(inDetail){
      els.detailSpeechError.innerHTML='<div class="banner-error">'+t('errNoSpeech')+'</div>';
    }else{
      showToast(t('errNoSpeech'));
    }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.voice=v; u.rate=ttsRate;
    u.onerror=function(){ speechError(inDetail); };
    window.speechSynthesis.speak(u);
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    if(inDetail) els.detailSpeechError.innerHTML='';
  }catch(e){
    speechError(inDetail);
  }
}
/* 停止所有 TTS */
function stopSpeak(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
}
function speechError(inDetail){
  if(inDetail) els.detailSpeechError.innerHTML='<div class="banner-error">'+t('errSpeechFail')+'</div>';
  else showToast(t('errSpeechFail'));
}

        storeSet('gss.language', code);

        renderLanguageMenu();
        renderAll();
      }
      menu.classList.add('hidden');
    });
  });
}

var quizSession={active:false, idx:0, score:0, answered:false, selected:-1};
function renderQuiz(){
  els.quizTitle.textContent=t('quizTitle');
  els.quizSub.textContent=t('quizSub');
  if(!quizSession.active){
    els.quizWrap.innerHTML='<div class="quiz-intro">'
      +'<p>'+QUIZ.length+' · '+t('quizSub')+'</p>'
      +'<button class="cta btn-block" id="qStartBtn">'+t('qStart')+'</button></div>';
    var sb=$('qStartBtn');
    if(sb) sb.addEventListener('click', function(){ quizSession.active=true; quizSession.idx=0; quizSession.score=0; renderQuiz(); });
    return;
  }
  if(quizSession.idx>=QUIZ.length){
    var pct=Math.round(quizSession.score/QUIZ.length*100);
    els.quizWrap.innerHTML='<div class="quiz-result"><div class="score-big">'+quizSession.score+'/'+QUIZ.length+'</div>'
      +'<div class="metric">'+t('qScore')+': '+pct+'%</div>'
      +'<button class="cta btn-block" id="qAgainBtn">'+t('qStart')+'</button>'
      +'<button class="cta ghost btn-block" id="qDoneBtn">'+t('qDone')+'</button></div>';
    var again=$('qAgainBtn'), done=$('qDoneBtn');
    if(again) again.addEventListener('click', function(){ quizSession.active=true; quizSession.idx=0; quizSession.score=0; renderQuiz(); });
    if(done) done.addEventListener('click', function(){ quizSession.active=false; window.location.hash='#/stats'; });
    return;
  }
  var q=QUIZ[quizSession.idx];
  var qid='q'+quizSession.idx;
  var html='<div class="quiz-q"><div class="metric">'+t('quizSub')+' · '+(quizSession.idx+1)+'/'+QUIZ.length+'</div>'
    +'<div class="qtext de">'+q.q+'</div><div class="opt-list">';
  q.opts.forEach(function(op, oi){
    var cls='opt';
    if(quizSession.answered){
      if(oi===q.correct) cls+=' correct';
      else if(oi===quizSession.selected) cls+=' wrong';
    }
    html+='<button class="'+cls+'" data-opt="'+oi+'"'+(quizSession.answered?' disabled':'')+'>'+op+'</button>';
  });
  html+='</div>';
  if(quizSession.answered){
    var ok = quizSession.selected===q.correct;
    html+='<div class="qfeedback '+(ok?'ok':'no')+'">'+(ok?t('qCorrect'):t('qWrong'))+'</div>'
      +'<div class="qexpl"><b>'+t('qExplanation')+':</b> '+(cm(qid)||q.mean)+'</div>'
      +'<button class="cta btn-block" id="qNextBtn">'+t('qNext')+'</button>';
  }
  html+='</div>';
  els.quizWrap.innerHTML=html;
  els.quizWrap.querySelectorAll('[data-opt]').forEach(function(ob){
    ob.addEventListener('click', function(){
      if(quizSession.answered) return;
      quizSession.answered=true;
      quizSession.selected=+ob.getAttribute('data-opt');
      var ok = quizSession.selected===q.correct;
      if(ok) quizSession.score++;
      srsRecord('quiz_'+quizSession.idx, ok);
      QUIZ_STATE.done=(QUIZ_STATE.done||0)+1;
      if(ok) QUIZ_STATE.correct=(QUIZ_STATE.correct||0)+1;
      persistAll();
      renderQuiz();
    });
  });
  var nb=$('qNextBtn');
  if(nb) nb.addEventListener('click', function(){ quizSession.answered=false; quizSession.idx++; renderQuiz(); });
}

function renderLetterBlocks(id){
  var L=ALPHABET.find(function(x){return x.id===id;});
  if(!L){ els.letterBlocks.innerHTML=''; return; }
  var isVowel = (L.type==='vowel');
  var isCons = (L.type==='consonant');
  var done=blocksDone(id);
  var blk=[];
  blk.push({n:1, de:(isVowel? 'A, E, I, O, U — the German vowels. Write: ':'Recognise and write the letter: ')+L.ch, tip:L.ch});
  blk.push({n:2, de:'Letter name: '+L.name+' · '+L.ipa});
  if(isVowel){
    blk.push({n:3, de:'Long vs short: "Ah", "eh", "ee" — double vowel or h after vowel makes it long. Compare: '+L.example+' (long).'});
  }else{
    blk.push({n:3, de:'Long/short: vowel length matters. Many consonants sound clipped before a double consonant.'});
  }
  blk.push({n:4, de:(isCons? 'Consonant combos: ch, sch, sp, st, tz, pf. Many are read together, e.g. sch = [ʃ].':'Special combos and umlauts: ä, ö, ü, and ß are German special letters.')});
  blk.push({n:5, de:'The letter in a word: '+L.example+' — '+gloss(L.gloss)+' ('+L.ipa+').'});
  blk.push({n:6, de:'Listen and repeat the word, then write the letter on the canvas below.'});
  var html='';
  blk.forEach(function(b){
    var key='b'+b.n;
    var isDone=!!done[key];
    html+='<div class="blk'+(isDone?' done':'')+'">'
      +'<div class="blk-head"><span class="blk-num">'+b.n+'</span><b>'+t('blk'+b.n)+'</b>'

      +'<button class="spk small" data-blkspk="'+b.n+'" aria-label="'+t('ltrSpeak')+'">🔊 '+t('ltrSpeak')+'</button>'
      +'<button class="cta ghost small" data-blk="'+b.n+'">'+(isDone?t('statusMastered'):t('qDone'))+'</button>'
      +'</div>';
  });

  els.letterBlocks.querySelectorAll('[data-blkspk]').forEach(function(b){
    b.addEventListener('click', function(){
      var n=+b.getAttribute('data-blkspk');

  els.letterBlocks.querySelectorAll('[data-blk]').forEach(function(b){

      renderLetterBlocks(id);
    });
  });
}

/* ---- A9 畫布 ---- */
var cvMode='trace';  /* trace | free */
var cvDrawing=false;
var cvStrokes=[];
function initCanvas(){
  var c=els.handwritingCanvas, ctx=c.getContext('2d');
  var w=c.parentElement.clientWidth, h=220;
  c.width=w; c.height=h;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1B365D'; ctx.lineWidth=3;
  function pos(ev){
    var r=c.getBoundingClientRect();
    var pt=(ev.touches&&ev.touches[0])||ev;
    return {x:pt.clientX-r.left, y:pt.clientY-r.top};
  }
  function start(ev){ ev.preventDefault(); cvDrawing=true; cvStrokes.push([]); drawTo(pos(ev)); }
  function drawTo(p){ if(!cvDrawing) return; var ctx=c.getContext('2d'); cvStrokes[cvStrokes.length-1].push(p); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.5,p.y+0.5); ctx.stroke(); }
  function move(ev){ if(!cvDrawing) return; ev.preventDefault(); drawTo(pos(ev)); }
  function end(ev){ ev.preventDefault(); cvDrawing=false; }
  c.addEventListener('pointerdown', start);
  c.addEventListener('pointermove', move);
  c.addEventListener('pointerup', end);
  c.addEventListener('pointerleave', end);
  function redraw(){
    var ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.beginPath();
    cvStrokes.forEach(function(stroke){
      if(!stroke.length) return;
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for(var i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x, stroke[i].y);
    });
    ctx.stroke();
  }
  function toolbar(){
    els.canvasTools.innerHTML=
      '<button class="ctool" data-cv="trace">'+t('cvTrace')+'</button>'
      +'<button class="ctool" data-cv="free">'+t('cvFree')+'</button>'
      +'<button class="ctool" data-cv="clear">'+t('cvClear')+'</button>'
      +'<button class="ctool" data-cv="undo">'+t('cvUndo')+'</button>'
      +'<button class="ctool" data-cv="ref">'+t('cvShowRef')+'</button>'
      +'<button class="ctool accent" data-cv="submit">'+t('cvSubmit')+'</button>';
    els.canvasTools.querySelectorAll('[data-cv]').forEach(function(b){
      b.addEventListener('click', function(){
        var act=b.getAttribute('data-cv');
        if(act==='trace'){ cvMode='trace'; els.canvasMsg.textContent=t('cvMsgTrace'); }
        else if(act==='free'){ cvMode='free'; els.canvasMsg.textContent=''; }
        else if(act==='clear'){ cvStrokes=[]; redraw(); els.canvasMsg.textContent=''; }
        else if(act==='undo'){ cvStrokes.pop(); redraw(); els.canvasMsg.textContent=''; }
        else if(act==='ref'){
          var g=els.referenceGlyph;
          if(g.classList.contains('hidden')){
            g.classList.remove('hidden');
            b.textContent=t('cvHideRef');
          }else{
            g.classList.add('hidden');
            b.textContent=t('cvShowRef');
          }
        }
        else if(act==='submit'){
          if(cvStrokes.length && cvStrokes.some(function(s){return s.length>0;})){
            var o=BLOCKS[activeLetter]||{}; o.b6=true; BLOCKS[activeLetter]=o; persistAll();
            els.canvasMsg.textContent=t('cvMsgDone');
          }else{
            els.canvasMsg.textContent=t('cvMsgTrace');
          }
        }
      });
    });
  }
  toolbar();
  els.referenceGlyph.textContent=activeLetter;

/* ---- 德語數字純函數（無 DOM 依賴） ---- */
var NUM_W = {0:'null',1:'eins',2:'zwei',3:'drei',4:'vier',5:'fünf',6:'sechs',7:'sieben',8:'acht',9:'neun',
  10:'zehn',11:'elf',12:'zwölf',13:'dreizehn',14:'vierzehn',15:'fünfzehn',16:'sechzehn',17:'siebzehn',18:'achtzehn',19:'neunzehn',
  20:'zwanzig',30:'dreißig',40:'vierzig',50:'fünfzig',60:'sechzig',70:'siebzig',80:'achtzig',90:'neunzig'};

function numberToGerman(n){
  n=Math.round(Math.abs(n));
  if(n===0) return 'null';
  if(n<=19) return NUM_W[n];
  if(n<100){
    var ones=n%10, tens=Math.floor(n/10)*10;
    if(ones===0) return NUM_W[tens];
    var ow=(ones===1)?'ein':NUM_W[ones];
    return ow+'und'+NUM_W[tens];
  }
  if(n<1000){
    var h=Math.floor(n/100), rest=n%100;
    var hw=(h===1)?'einhundert':NUM_W[h]+'hundert';
    return hw+(rest>0?numberToGerman(rest):'');
  }
  if(n<1000000){
    var th=Math.floor(n/1000), r2=n%1000;
    var tw=(th===1)?'eintausend':numberToGerman(th)+'tausend';
    return tw+(r2>0?numberToGerman(r2):'');
  }
  if(n<1e9){
    var m1=Math.floor(n/1e6), r3=n%1e6;
    var mw=(m1===1)?'eine Million':numberToGerman(m1)+' Millionen';
    return mw+(r3>0?' '+numberToGerman(r3):'');
  }
  if(n<1e12){
    var m2=Math.floor(n/1e9), r4=n%1e9;
    var m2w=(m2===1)?'eine Milliarde':numberToGerman(m2)+' Milliarden';
    return m2w+(r4>0?' '+numberToGerman(r4):'');
  }
  var b1=Math.floor(n/1e12), r5=n%1e12;
  var bw=(b1===1)?'eine Billion':numberToGerman(b1)+' Billionen';
  return bw+(r5>0?' '+numberToGerman(r5):'');
}

function digitToGerman(str){
  var map={'0':'null','1':'eins','2':'zwei','3':'drei','4':'vier','5':'fünf','6':'sechs','7':'sieben','8':'acht','9':'neun'};
  return String(str).replace(/\D/g,'').split('').map(function(d){return map[d]||d;}).join(', ');
}

function yearToGerman(n){
  n=Math.round(Math.abs(n));
  if(n>=2000){
    var th=Math.floor(n/1000), r=n%1000;
    var tw=(th===1)?'eintausend':numberToGerman(th)+'tausend';
    return tw+(r>0?numberToGerman(r):'');
  }
  var h=Math.floor(n/100), rest=n%100;
  return numberToGerman(h)+'hundert'+(rest>0?numberToGerman(rest):'');
}

function moneyToGerman(x){
  x=Math.abs(x);
  var euros=Math.floor(x);
  var cents=Math.round((x-euros)*100);
  if(cents===0) return numberToGerman(euros)+' Euro';
  return numberToGerman(euros)+' Euro '+numberToGerman(cents);
}

function ordinalToGerman(n){
  n=Math.round(Math.abs(n));
  var irr={1:'erste',2:'zweite',3:'dritte',7:'siebte'};
  if(irr[n]) return irr[n];
  var stem;
  if(n===100) stem='hundert';
  else if(n===1000) stem='tausend';
  else stem=numberToGerman(n);
  if(n>=20) return stem+'ste';
  return stem+'te';
}

function timeToGerman(str){
  var parts=String(str).split(':');
  var h=parseInt(parts[0],10), m=parseInt(parts[1]||'0',10);
  if(isNaN(h)) return '';
  var result=numberToGerman(h)+' Uhr';
  if(m>0) result+=' '+numberToGerman(m);
  return result;
}

/* 寬容輸入解析 */
function parseGermanInput(str){
  str=String(str).trim();
  if(!str) return null;
  if(str.indexOf(':')>=0) return {kind:'time', raw:str};
  var hasC=str.indexOf(',')>=0, hasD=str.indexOf('.')>=0;
  var norm;
  if(hasC&&hasD){ norm=str.replace(/\./g,'').replace(',','.'); }
  else if(hasC){ norm=str.replace(',','.'); }
  else if(hasD){
    var di=str.indexOf('.');
    var after=str.slice(di+1);
    if(/^\d{3}$/.test(after) && str.replace(/\D/g,'').length===di+3){ norm=str.replace(/\./g,''); }
    else norm=str;
  } else { norm=str; }
  var num=parseFloat(norm);
  if(isNaN(num)) return null;
  return {kind:'number', value:num};
}

/* 依情境轉換 */
function convertByCtx(inputStr, ctxId){
  var parsed=parseGermanInput(inputStr);
  if(!parsed) return null;
  if(ctxId==='phone'){
    return {text:digitToGerman(parsed.kind==='number'?parsed.value:inputStr)};
  }
  if(ctxId==='time'){
    if(parsed.kind!=='time'){
      /* 也接受純數字當小時 */
      if(parsed.kind==='number') return {text:numberToGerman(parsed.value)+' Uhr'};
      return null;
    }
    return {text:timeToGerman(parsed.raw)};
  }
  if(parsed.kind!=='number') return null;
  var v=parsed.value;
  if(ctxId==='count') return {text:numberToGerman(v)};
  if(ctxId==='age') return {text:numberToGerman(v)+' Jahre alt'};
  if(ctxId==='money') return {text:moneyToGerman(v)};
  if(ctxId==='year') return {text:yearToGerman(v)};
  if(ctxId==='ordinal') return {text:'der '+ordinalToGerman(v)};
  return {text:numberToGerman(v)};
}

/* ---- 依序播放會話 ---- */
var playQueue=null, playIdx=0;
function playDialogueLines(d){
  stopSpeak();
  playQueue=d.lines.slice();
  playIdx=0;
  function next(){
    if(playIdx>=playQueue.length){ playQueue=null; return; }
    var line=playQueue[playIdx];
    var u=new SpeechSynthesisUtterance(line.de);
    var v=pickGermanVoice();
    if(v) u.voice=v;
    u.lang='de-DE'; u.rate=ttsRate;
    u.onend=function(){ playIdx++; setTimeout(next, 300); };
    u.onerror=function(){ playQueue=null; };
    window.speechSynthesis.speak(u);
  }
  next();
}
