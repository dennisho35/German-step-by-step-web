<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>German Step by Step International</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1E36'/%3E%3Crect x='14' y='18' width='36' height='8' fill='%23D9232E'/%3E%3Crect x='14' y='28' width='36' height='8' fill='%23F2A918'/%3E%3C/svg%3E">
<style>
:root{
  --bg-page:#F7F5F0; --bg-cream:#FDF6E4; --bg-card:#FFFFFF; --bg-subtle:#EFECE6;
  --navy-900:#0F1E36; --navy-800:#1B2E4B; --navy-700:#284268;
  --de-red:#D9232E; --de-red-soft:#FCE8E9; --de-gold:#F2A918; --de-gold-soft:#FEF5DF;
  --text-main:#111827; --text-muted:#4B5563; --border-color:#E2DEC9;
  --success:#15803D; --success-bg:#DCFCE7; --warn:#B45309;
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px;
  --shadow-sm:0 2px 8px rgba(15,30,54,.06); --shadow-md:0 8px 24px rgba(15,30,54,.10);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,Helvetica,Arial,"Apple Symbols",sans-serif;
}
html.dark{
  --bg-page:#0B1424; --bg-cream:#13203A; --bg-card:#152238; --bg-subtle:#1E2C46;
  --text-main:#E7ECF5; --text-muted:#9FB0C8; --border-color:#2A3A58;
  --navy-900:#0F1E36; --navy-800:#1B2E4B; --navy-700:#284268;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:var(--bg-page);color:var(--text-main);
  font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
button,select,input{font-family:inherit;font-size:inherit;color:inherit;}
.top-header{position:sticky;top:0;z-index:1000;background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  color:#fff;border-bottom:3px solid var(--de-gold);box-shadow:0 4px 14px rgba(15,30,54,.18);}
.header-inner{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lang-picker{position:relative;}
.lang-trigger{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.3);border-radius:var(--radius-sm);padding:7px 12px;font-size:.9rem;font-weight:600;cursor:pointer;}
.lang-trigger:hover{background:rgba(255,255,255,.24);border-color:var(--de-gold);}
.lang-menu{position:absolute;top:calc(100%+6px);left:0;width:250px;max-height:380px;overflow-y:auto;
  background:var(--bg-card);color:var(--text-main);border-radius:var(--radius-md);border:1px solid var(--border-color);
  box-shadow:var(--shadow-md);padding:6px;display:none;z-index:1200;}
.lang-menu.open{display:block;}
.lang-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;
  border:none;background:transparent;color:var(--text-main);border-radius:8px;text-align:left;font-size:.9rem;cursor:pointer;}
.lang-item:hover{background:var(--bg-subtle);}
.lang-item.active{background:var(--de-gold-soft);font-weight:700;color:var(--navy-900);border-left:3px solid var(--de-red);}
.brand-box{display:flex;align-items:center;gap:10px;cursor:pointer;background:transparent;border:none;color:inherit;text-align:left;}
.logo-slot{width:44px;height:44px;border-radius:11px;overflow:hidden;background:var(--bg-cream);
  border:2px solid rgba(255,255,255,.4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.logo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-size:1.05rem;font-weight:800;color:#fff;line-height:1.2;}
.brand-sub{font-size:.74rem;color:#CBD5E1;}
.hbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:.85rem;font-weight:600;cursor:pointer;}
.hbtn:hover{background:rgba(255,255,255,.24);}
.spd-group{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);padding:4px 8px;border-radius:8px;}
.spd-btn{background:transparent;border:none;color:#fff;padding:5px 9px;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;opacity:.75;}
.spd-btn.active{background:var(--de-gold);color:var(--navy-900);opacity:1;}
.aids-toolbar{background:var(--bg-card);border-bottom:1px solid var(--border-color);padding:8px 16px;}
.aids-toolbar-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;}
.preset-group,.toggle-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.preset-btn{border:1px solid var(--navy-900);background:var(--bg-subtle);color:var(--text-main);
  padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;cursor:pointer;}
.preset-btn.active{background:var(--navy-900);color:#fff;}
.aid-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;
  border:1px solid var(--border-color);background:var(--bg-page);font-size:.78rem;font-weight:600;cursor:pointer;user-select:none;}
.aid-toggle input{accent-color:var(--de-red);cursor:pointer;}
.main-nav{max-width:1240px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.nav-tab{flex:1;min-width:130px;background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border-color);
  padding:11px 12px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:700;cursor:pointer;text-align:center;white-space:nowrap;}
.nav-tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);box-shadow:var(--shadow-sm);}
.main-wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px;}
.panel{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.hero-card{background:linear-gradient(135deg,#FFFDF9,var(--bg-cream));border:2px solid #E5D7B4;border-radius:var(--radius-lg);
  padding:22px;margin-bottom:18px;box-shadow:var(--shadow-md);}
html.dark .hero-card{border-color:var(--border-color);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:var(--radius-sm);
  font-weight:600;font-size:.88rem;border:1px solid transparent;cursor:pointer;transition:.15s;}
.btn-primary{background:var(--navy-900);color:#fff;} .btn-primary:hover{background:var(--navy-700);}
.btn-red{background:var(--de-red);color:#fff;} .btn-red:hover{background:#B81B24;}
.btn-gold{background:var(--de-gold);color:var(--navy-900);font-weight:700;}
.btn-outline{background:var(--bg-card);color:var(--text-main);border-color:var(--border-color);} .btn-outline:hover{background:var(--bg-subtle);}
.btn-sm{padding:6px 10px;font-size:.8rem;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.card{background:var(--bg-card);border:2px solid var(--border-color);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);}
.card h3{font-size:1rem;color:var(--navy-900);margin-bottom:6px;}
html.dark .card h3{color:#fff;}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;}
.chip-new{background:var(--bg-subtle);color:var(--text-muted);}
.chip-learned{background:var(--de-gold-soft);color:var(--warn);}
.chip-mastered{background:var(--success-bg);color:var(--success);}
.chip-review{background:var(--de-red-soft);color:var(--de-red);}
.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.letter-card{background:var(--bg-card);border:2px solid var(--border-color);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:.15s;}
.letter-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--navy-700);}
.letter-card.mastered{border-color:var(--success);}
.letter-big{font-size:2rem;font-weight:800;color:var(--navy-900);line-height:1.1;}
html.dark .letter-big{color:#fff;}
.pron{display:flex;flex-direction:column;gap:3px;background:var(--bg-page);border:1px solid var(--border-color);border-radius:9px;padding:7px 9px;font-size:.82rem;margin:6px 0;}
.l-ipa{color:#2563EB;font-weight:700;}
.l-native{color:#0F766E;font-weight:700;}
.l-actual{color:#9333EA;font-weight:700;}
.l-trans{color:var(--text-main);font-weight:600;}
.l-note{color:var(--text-muted);font-size:.76rem;border-top:1px dashed var(--border-color);padding-top:3px;margin-top:2px;}
.num-cell{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:10px;}
.num-cell.red{border:2px solid var(--de-red);background:var(--de-red-soft);}
.num-sym{font-weight:800;color:var(--navy-900);font-size:1.05rem;}
html.dark .num-sym{color:#fff;}
.num-de{font-size:.85rem;margin:3px 0;}
.num-trans{font-size:.76rem;color:var(--text-muted);}
.rule-note{font-size:.74rem;color:var(--de-red);margin-top:3px;}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.subtab{border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-main);padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;}
.subtab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
.dlg-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border-color);}
.dlg-line:last-child{border-bottom:none;}
.spk{font-weight:800;min-width:38px;color:var(--navy-700);}
.gram-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;}
.gram-table th,.gram-table td{border:1px solid var(--border-color);padding:8px 10px;text-align:left;}
.gram-table th{background:var(--bg-subtle);color:var(--navy-900);}
.quiz-opt{display:block;width:100%;text-align:left;padding:11px 13px;margin:7px 0;border-radius:var(--radius-sm);
  border:2px solid var(--border-color);background:var(--bg-card);font-size:.92rem;font-weight:600;cursor:pointer;}
.quiz-opt:hover{border-color:var(--navy-900);background:var(--bg-subtle);}
.quiz-opt.correct{border-color:var(--success);background:var(--success-bg);color:#14532D;}
.quiz-opt.wrong{border-color:var(--de-red);background:var(--de-red-soft);color:#7F1D1D;}
.modal-mask{position:fixed;inset:0;background:rgba(8,15,30,.6);z-index:2000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;}
.modal-mask.open{display:flex;}
.modal{background:var(--bg-card);color:var(--text-main);border-radius:var(--radius-lg);max-width:760px;width:100%;
  padding:22px;box-shadow:var(--shadow-md);border:1px solid var(--border-color);}
.modal h2{color:var(--navy-900);margin-bottom:12px;font-size:1.25rem;}
html.dark .modal h2{color:#fff;}
.modal-close{float:right;background:var(--bg-subtle);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;}
.canvas-stage{position:relative;width:300px;height:300px;background:#fff;border:3px solid var(--navy-900);border-radius:var(--radius-md);margin:0 auto;touch-action:none;overflow:hidden;}
.canvas-stage canvas{width:100%;height:100%;display:block;touch-action:none;}
.toast-msg{position:fixed;bottom:20px;right:20px;z-index:3000;background:var(--navy-900);color:#fff;padding:12px 18px;
  border-radius:var(--radius-sm);border-left:4px solid var(--de-gold);box-shadow:var(--shadow-md);font-size:.88rem;max-width:360px;display:none;}
.toast-msg.show{display:block;}
.hidden{display:none!important;}
.progressbar{height:10px;background:var(--bg-subtle);border-radius:999px;overflow:hidden;margin:6px 0;}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--de-gold),var(--de-red));}
.srs-card{background:var(--bg-cream);border:2px solid var(--border-color);border-radius:var(--radius-md);padding:20px;text-align:center;cursor:pointer;}
.banner-ok{background:var(--success-bg);color:#14532D;padding:8px 12px;border-radius:8px;font-weight:600;}
.banner-err{background:var(--de-red-soft);color:#7F1D1D;padding:8px 12px;border-radius:8px;font-weight:600;}
input[type=text],select{padding:9px 11px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-main);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.muted{color:var(--text-muted);font-size:.84rem;}
a{color:var(--navy-700);}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="lang-picker">
        <button type="button" class="lang-trigger" id="langTriggerBtn" aria-haspopup="listbox">
          <span id="activeLangFlag">🇬🇧</span><span id="activeLangLabel">English (UK)</span><span>▾</span>
        </button>
        <div class="lang-menu" id="langMenuList" role="listbox"></div>
      </div>
      <button type="button" class="brand-box" id="brandHomeBtn">
        <div class="logo-slot" id="headerLogoSlot"></div>
        <div style="display:flex;flex-direction:column;">
          <span class="brand-name" id="uiAppTitle">German Step by Step</span>
          <span class="brand-sub" id="uiAppSubtitle">International</span>
        </div>
      </button>
    </div>
    <div class="header-right">
      <button type="button" class="hbtn" id="guideBtn">📖 <span id="guideOpenLbl">Guide</span></button>
      <div class="spd-group" id="spdGroup">
        <button type="button" class="spd-btn" data-spd="0.5">🐢0.5x</button>
        <button type="button" class="spd-btn" data-spd="0.8">🚶0.8x</button>
        <button type="button" class="spd-btn active" data-spd="1.0">🏃1.0x</button>
      </div>
      <button type="button" class="hbtn" id="darkToggleBtn">🌙</button>
      <button type="button" class="hbtn" id="settingsBtn">⚙️</button>
    </div>
  </div>
</header>

<section class="aids-toolbar">
  <div class="aids-toolbar-inner">
    <div class="preset-group">
      <button type="button" class="preset-btn active" id="presetBeginner">🌱 Beginner</button>
      <button type="button" class="preset-btn" id="presetAdvanced">🎓 Advanced</button>
    </div>
    <div class="toggle-group">
      <label class="aid-toggle"><input type="checkbox" id="chkIpa" checked><span id="lblIpa">IPA</span></label>
      <label class="aid-toggle"><input type="checkbox" id="chkNative" checked><span id="lblNative">Native</span></label>
      <label class="aid-toggle"><input type="checkbox" id="chkActual" checked><span id="lblActual">Actual</span></label>
      <label class="aid-toggle"><input type="checkbox" id="chkTrans" checked><span id="lblTrans">Translate</span></label>
      <label class="aid-toggle"><input type="checkbox" id="chkNotes" checked><span id="lblNotes">Notes</span></label>
    </div>
  </div>
</section>

<nav class="main-nav" id="mainNavContainer"></nav>
<main class="main-wrap" id="appRoot"><noscript>Please enable JavaScript.</noscript></main>

<div class="modal-mask" id="guideModal"><div class="modal"><button class="modal-close" data-close="guideModal">✕</button><div id="guideModalBody"></div></div></div>
<div class="modal-mask" id="settingsModal"><div class="modal"><button class="modal-close" data-close="settingsModal">✕</button><div id="settingsModalBody"></div></div></div>
<div class="modal-mask" id="letterModal"><div class="modal" style="max-width:820px;"><button class="modal-close" data-close="letterModal">✕</button><div id="letterModalBody"></div></div></div>

<div class="toast-msg" id="toastBox" role="status" aria-live="polite"></div>

<script>
/* ============================================================
 * ANCHOR: data + logic injected by build
 * ============================================================ */

/*===CORE==*/
'use strict';
/* ================= 1. LOCALES + I18N ================= */
const SUPPORTED_LOCALES=[
  {code:'zh-HK',name:'正體中文（香港）',flag:'🇭🇰'},
  {code:'en-GB',name:'English (UK)',flag:'🇬🇧'},
  {code:'ja-JP',name:'日本語',flag:'🇯🇵'},
  {code:'ko-KR',name:'한국어',flag:'🇰🇷'},
  {code:'th-TH',name:'ไทย',flag:'🇹🇭'},
  {code:'vi-VN',name:'Tiếng Việt',flag:'🇻🇳'}
];
const LOCALE_CODES=SUPPORTED_LOCALES.map(l=>l.code);
/* Map a 16-entry L10 array onto the 6 active locales (first 6 entries). */
function L10(arr){
  const map={};
  for(let i=0;i<LOCALE_CODES.length;i++){ map[LOCALE_CODES[i]]=arr[i]||arr[1]||arr[0]; }
  return map;
}
/* tr6 objects use keys zh/en/ja/ko/th/vi. Map to locale codes. */
const TR6_FROM_LOCALE={'zh-HK':'zh','en-GB':'en','ja-JP':'ja','ko-KR':'ko','th-TH':'th','vi-VN':'vi'};
const TR6_TO_LOCALE={zh:'zh-HK',en:'en-GB',ja:'ja-JP',ko:'ko-KR',th:'th-TH',vi:'vi-VN'};

/* ================= 2. STATE + STORAGE ================= */
const SKEY='gss.';
function storeGet(k,def){ try{ const v=localStorage.getItem(SKEY+k); return v===null?def:JSON.parse(v);}catch(e){ return def; } }
function storeSet(k,v){ try{ localStorage.setItem(SKEY+k,JSON.stringify(v)); }catch(e){} }

const state={
  locale: storeGet('language','en-GB'),
  dark: storeGet('dark',false),
  speed: storeGet('spd',1.0),
  layers: storeGet('layers',{ipa:true,native:true,actual:true,trans:true,notes:true}),
  goal: storeGet('goal',10),
  studiedSec: storeGet('studied',0),
  streak: storeGet('streak',0),
  lastDay: storeGet('lastDay',''),
  letterState: storeGet('letterState',{}),   // id -> new|learned|mastered|review
  srs: storeGet('srs',{}),                    // card -> {due:int, ivl:int}
  wrong: storeGet('wrong',[]),                 // wrong quiz ids
  stars: storeGet('stars',[]),                // saved phrases
  writeCount: storeGet('writeCount',0),
  quizStat: storeGet('quiz',{done:0,correct:0})
};
function persist(){
  storeSet('language',state.locale); storeSet('dark',state.dark); storeSet('spd',state.speed);
  storeSet('layers',state.layers); storeSet('goal',state.goal); storeSet('studied',state.studiedSec);
  storeSet('streak',state.streak); storeSet('lastDay',state.lastDay); storeSet('letterState',state.letterState);
  storeSet('srs',state.srs); storeSet('wrong',state.wrong); storeSet('stars',state.stars);
  storeSet('writeCount',state.writeCount); storeSet('quiz',state.quizStat);
}

/* ================= 3. t() / tr6() ================= */
function t(key){
  const m=(typeof NEW_UI6!=='undefined')?NEW_UI6:null;
  if(m){
    if(m[state.locale]&&m[state.locale][key]!==undefined) return m[state.locale][key];
    if(m['en-GB']&&m['en-GB'][key]!==undefined) return m['en-GB'][key];
  }
  return '(unavailable)';
}
/* Pick the current-locale value out of a {zh,en,ja,ko,th,vi} object. */
function tr6(o){
  if(!o) return '';
  const k=TR6_FROM_LOCALE[state.locale]||'en';
  return o[k]!==undefined?o[k]:(o.en!==undefined?o.en:'');
}
/* L10-mapped object (GERMAN_ALPHABET meaning/tip): keyed by locale code. */
function l10(o){ return o? (o[state.locale]||o['en-GB']||'') : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= 4. TTS ================= */
let cachedVoice=null;
function pickGermanVoice(){
  if(cachedVoice) return cachedVoice;
  if(!('speechSynthesis' in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  for(let i=0;i<voices.length;i++){ if(/^de/i.test(voices[i].lang||'')){ cachedVoice=voices[i]; return cachedVoice; } }
  return null;
}
function voiceAvailable(){ return ('speechSynthesis' in window) && !!pickGermanVoice(); }
function speak(text,rate){
  if(!('speechSynthesis' in window)||!pickGermanVoice()){ toast(t('err.nospeech')||'No German voice'); return; }
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.voice=pickGermanVoice(); u.rate=(rate||state.speed);
    u.onerror=function(){};
    window.speechSynthesis.speak(u);
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
  }catch(e){ toast(t('err.nospeech')||'TTS error'); }
}
function stopSpeak(){ try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){} }

/* ================= 5. PURE NUMBER FUNCTIONS (reused) ================= */
const NUM_W={0:'null',1:'eins',2:'zwei',3:'drei',4:'vier',5:'fünf',6:'sechs',7:'sieben',8:'acht',9:'neun',
  10:'zehn',11:'elf',12:'zwölf',13:'dreizehn',14:'vierzehn',15:'fünfzehn',16:'sechzehn',17:'siebzehn',18:'achtzehn',19:'neunzehn',
  20:'zwanzig',30:'dreißig',40:'vierzig',50:'fünfzig',60:'sechzig',70:'siebzig',80:'achtzig',90:'neunzig'};
function numberToGerman(n){
  n=Math.round(Math.abs(n));
  if(n===0)return'null';
  if(n<=19)return NUM_W[n];
  if(n<100){const ones=n%10,tens=Math.floor(n/10)*10;if(ones===0)return NUM_W[tens];const ow=(ones===1)?'ein':NUM_W[ones];return ow+'und'+NUM_W[tens];}
  if(n<1000){const h=Math.floor(n/100),rest=n%100;const hw=(h===1)?'einhundert':NUM_W[h]+'hundert';return hw+(rest>0?numberToGerman(rest):'');}
  if(n<1000000){const th=Math.floor(n/1000),r2=n%1000;const tw=(th===1)?'eintausend':numberToGerman(th)+'tausend';return tw+(r2>0?numberToGerman(r2):'');}
  if(n<1e9){const m1=Math.floor(n/1e6),r3=n%1e6;const mw=(m1===1)?'eine Million':numberToGerman(m1)+' Millionen';return mw+(r3>0?' '+numberToGerman(r3):'');}
  if(n<1e12){const m2=Math.floor(n/1e9),r4=n%1e9;const m2w=(m2===1)?'eine Milliarde':numberToGerman(m2)+' Milliarden';return m2w+(r4>0?' '+numberToGerman(r4):'');}
  const b1=Math.floor(n/1e12),r5=n%1e12;const bw=(b1===1)?'eine Billion':numberToGerman(b1)+' Billionen';return bw+(r5>0?' '+numberToGerman(r5):'');
}
function digitToGerman(str){const map={'0':'null','1':'eins','2':'zwei','3':'drei','4':'vier','5':'fünf','6':'sechs','7':'sieben','8':'acht','9':'neun'};return String(str).replace(/\D/g,'').split('').map(d=>map[d]||d).join(', ');}
function yearToGerman(n){n=Math.round(Math.abs(n));if(n>=2000){const th=Math.floor(n/1000),r=n%1000;const tw=(th===1)?'eintausend':numberToGerman(th)+'tausend';return tw+(r>0?numberToGerman(r):'');}if(n<100)return numberToGerman(n);if(n<1000)return numberToGerman(n);const h=Math.floor(n/100),rest=n%100;return numberToGerman(h)+'hundert'+(rest>0?numberToGerman(rest):'');}
function moneyToGerman(x){x=Math.abs(x);const euros=Math.floor(x);const cents=Math.round((x-euros)*100);if(cents===0)return numberToGerman(euros)+' Euro';return numberToGerman(euros)+' Euro '+numberToGerman(cents);}
function ordinalToGerman(n){n=Math.round(Math.abs(n));const irr={1:'erste',2:'zweite',3:'dritte',7:'siebte',8:'achte'};if(irr[n])return irr[n];let stem;if(n===100)stem='hundert';else if(n===1000)stem='tausend';else stem=numberToGerman(n);if(n>=20)return stem+'ste';return stem+'te';}

}

}
function dayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function bumpStreak(){
  const k=dayKey();
  if(state.lastDay!==k){
    const y=new Date(); y.setDate(y.getDate()-1);
    const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    state.streak=(state.lastDay===yk)? state.streak+1 : 1;
    state.lastDay=k; persist();
  }
}

'use strict';
/* ================= NAV + ROUTER ================= */
const NAV=[
  {hash:'#/home',key:'nav.home',icon:'🏠'},
  {hash:'#/alphabet',key:'nav.alphabet',icon:'🔤'},
  {hash:'#/numbers',key:'nav.numbers',icon:'🔢'},
  {hash:'#/grammar',key:'nav.grammar',icon:'📘'},
  {hash:'#/quiz',key:'nav.quiz',icon:'🎯'}
];
function curHash(){ const h=location.hash||'#/home'; return h; }
function renderNav(){
  const c=document.getElementById('mainNavContainer');
  c.innerHTML=NAV.map(n=>'<button class="nav-tab'+(curHash()===n.hash?' active':'')+'" data-hash="'+n.hash+'">'+n.icon+' '+t(n.key)+'</button>').join('');
  c.querySelectorAll('.nav-tab').forEach(b=>b.onclick=()=>{ location.hash=b.getAttribute('data-hash'); });
}
function lyr(layer){ return !!state.layers[layer]; }

/* ================= HOME ================= */
function letterProgress(){
  const total=GERMAN_ALPHABET.length;
  let m=0; GERMAN_ALPHABET.forEach(l=>{ if(state.letterState[l.id]==='mastered') m++; });
  return {done:m,total:total,pct:Math.round(m/total*100)};
}
function renderHome(){
  const lp=letterProgress();
  const mins=Math.round(state.studiedSec/60);
  const voiceOk=voiceAvailable();
  let html='<div class="hero-card"><h2 style="color:var(--navy-900)">'+t('hero.welcome')+'</h2>'+
    '<p class="muted" style="margin-top:6px">'+t('hero.sub')+'</p></div>';

  /* daily goal card */
  html+='<div class="panel"><h3 style="color:var(--navy-900)">🎯 '+t('goal.title')+'</h3><div class="row" style="margin:8px 0">';
  [5,10,15,30].forEach(m=>{ html+='<button class="btn btn-sm '+(state.goal===m?'btn-gold':'btn-outline')+'" data-goal="'+m+'">'+t('goal.min'+m)+'</button>'; });
  html+='</div><div class="row"><span>🔥 '+t('goal.streak')+': <b>'+state.streak+'</b></span><span>⏱ '+t('goal.today')+': <b>'+mins+'</b>/'+state.goal+' min</span></div>';
  html+='<div class="progressbar"><div style="width:'+Math.min(100,Math.round(mins/state.goal*100))+'%"></div></div>';
  html+='<div class="subtabs" style="margin-top:10px">'+
    '<button class="subtab" data-go-task="alphabet">🔁 '+t('goal.taskAlpha')+'</button>'+
    '<button class="subtab" data-go-task="numbers">🔢 '+t('goal.taskNum')+'</button>'+
    '<button class="subtab" data-go-task="grammar">💬 '+t('goal.taskDlg')+'</button></div></div>';

  /* voice status */
  html+='<div class="panel"><h3 style="color:var(--navy-900)">🔊 '+t('voice.title')+'</h3>'+
    '<div style="margin:8px 0">'+(voiceOk?'<span class="banner-ok">✅ '+t('voice.ok')+'</span>':'<span class="banner-err">❌ '+t('voice.fail')+'</span>')+'</div>'+
    '<button class="btn btn-outline btn-sm" id="voiceTestBtn">🔊 '+t('voice.test')+'</button></div>';

  /* 4 module cards */
  const mods=[
    {i:'🔤',title:'mod1.title',desc:'mod1.desc',hash:'#/alphabet',pct:lp.pct},
    {i:'🔢',title:'mod2.title',desc:'mod2.desc',hash:'#/numbers',pct:0},
    {i:'📘',title:'mod3.title',desc:'mod3.desc',hash:'#/grammar',pct:0},
    {i:'🎯',title:'mod4.title',desc:'mod4.desc',hash:'#/quiz',pct:state.quizStat.done?Math.round(state.quizStat.done/20*100):0}
  ];
  html+='<div class="grid grid-4">';
  mods.forEach(m=>{
    html+='<div class="card" data-go-mod="'+m.hash+'" style="cursor:pointer"><div style="font-size:1.6rem">'+m.i+'</div>'+
      '<h3>'+t(m.title)+'</h3><p class="muted" style="font-size:.82rem">'+t(m.desc)+'</p>'+
      '<div class="progressbar"><div style="width:'+m.pct+'%"></div></div>'+
      '<span class="muted">'+t('mod.progress')+': '+m.pct+'%</span></div>';
  });
  html+='</div>';

  const root=document.getElementById('appRoot'); root.innerHTML=html;
  root.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{ state.goal=parseInt(b.getAttribute('data-goal'),10); persist(); renderHome(); });
  root.querySelectorAll('[data-go-task]').forEach(b=>b.onclick=()=>{ location.hash='#'+b.getAttribute('data-go-task'); });
  root.querySelectorAll('[data-go-mod]').forEach(b=>b.onclick=()=>{ location.hash=b.getAttribute('data-go-mod'); });
  document.getElementById('voiceTestBtn').onclick=()=>{ if(!voiceAvailable()){toast(t('err.nospeech'));return;} speak('Guten Tag! Lernen wir Deutsch Schritt für Schritt.',1.0); };
}

/* ================= ALPHABET VIEW ================= */
let alphaTab='letters';
function letterStatusBadge(id){
  const s=state.letterState[id]||'new';
  const cls={new:'chip-new',learned:'chip-learned',mastered:'chip-mastered',review:'chip-review'}[s];
  return '<span class="chip '+cls+'">'+t('st.'+s)+'</span>';
}
function renderAlphabet(){
  const root=document.getElementById('appRoot');
  let html='<div class="subtabs">';
  [['letters','atab.letters'],['pairs','atab.pairs'],['compound','atab.compound'],['rules','atab.rules'],['confuse','atab.confuse'],['trainer','atab.trainer']].forEach(x=>{
    html+='<button class="subtab'+(alphaTab===x[0]?' active':'')+'" data-atab="'+x[0]+'">'+t(x[1])+'</button>';
  });
  html+='</div><div id="alphaPane"></div>';
  root.innerHTML=html;
  root.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{ alphaTab=b.getAttribute('data-atab'); renderAlphabet(); });
  const pane=document.getElementById('alphaPane');
  if(alphaTab==='letters') pane.innerHTML=tabLetters();
  else if(alphaTab==='pairs') pane.innerHTML=tabPairs();
  else if(alphaTab==='compound') pane.innerHTML=tabCompound();
  else if(alphaTab==='rules') pane.innerHTML=tabRules();
  else if(alphaTab==='confuse') pane.innerHTML=tabConfuse();
  else if(alphaTab==='trainer') pane.innerHTML=tabTrainer();

let writeStrokes=[];   // array of arrays of {x,y}
let curDraw=null;
function openLetterModal(id){
  const L=GERMAN_ALPHABET.find(x=>x.id===id); if(!L) return;
  writeStrokes=[]; curDraw=null;
  const ex=(typeof DE_LETTER_EXTRA!=='undefined'&&DE_LETTER_EXTRA[id])?DE_LETTER_EXTRA[id]:null;

    '<button class="btn btn-outline" id="stSpeak">🔊</button></div>';
  html+='<div class="canvas-stage"><canvas id="guideCanvas" width="300" height="300"></canvas><canvas id="writeCanvas" width="300" height="300" style="position:absolute;top:0;left:0"></canvas></div>';
  html+='<div class="row" style="justify-content:center;margin-top:10px">'+
    '<button class="btn btn-outline btn-sm" id="wUndo">'+t('m.undo')+'</button>'+

  html+='<div id="evalOut" class="muted" style="text-align:center;margin-top:8px"></div>';
  html+='<p class="muted" style="text-align:center;margin-top:6px">ℹ️ '+t('m.score')+'</p>';
  if(ex){ html+='<div class="panel" style="margin-top:12px"><b>'+esc(ex.ex.de)+'</b> <span class="l-ipa">/'+esc(ex.ex.ipa)+'/</span>'+
    (lyr('trans')?'<div class="muted">'+esc(tr6(ex.ex.tr6))+'</div>':'')+
    (lyr('notes')?'<div class="l-note">'+esc(tr6(ex.mnemonic6))+'</div>':'')+
    '<div class="row" style="margin-top:6px"><button class="btn btn-outline btn-sm" data-spk="'+esc(ex.ex.de)+'">🔊</button></div></div>'; }
  const body=document.getElementById('letterModalBody');
  body.innerHTML=html;
  document.getElementById('letterModal').classList.add('open');
  drawGuide(id,'upper');

  document.getElementById('stAnim').onclick=()=>animateStrokes(id,'upper');
  document.getElementById('stSpeak').onclick=()=>{ speak(L.letterName.replace(/\[.*?\]/,'').trim()); };
  body.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>speak(b.getAttribute('data-spk')));

  const wc=document.getElementById('writeCanvas');
  const rect=()=>wc.getBoundingClientRect();
  function pos(e){ const r=rect(); return {x:(e.clientX-r.left)/r.width*300, y:(e.clientY-r.top)/r.height*300}; }
  wc.onpointerdown=(e)=>{ wc.setPointerCapture(e.pointerId); curDraw=[pos(e)]; writeStrokes.push(curDraw); redrawWrite(); };
  wc.onpointermove=(e)=>{ if(curDraw){ curDraw.push(pos(e)); redrawWrite(); } };
  wc.onpointerup=()=>{ curDraw=null; };
  document.getElementById('wUndo').onclick=()=>{ writeStrokes.pop(); redrawWrite(); };
  document.getElementById('wClear').onclick=()=>{ writeStrokes=[]; redrawWrite(); };
  document.getElementById('wEval').onclick=()=>evalWrite(id);
}
function guideCtx(){ return document.getElementById('guideCanvas').getContext('2d'); }
function drawGuide(id,case_){
  const c=guideCtx(); c.clearRect(0,0,300,300);
  c.strokeStyle='#E5D7B4'; c.lineWidth=2; c.strokeRect(10,10,280,280);
  c.save(); c.translate(30,30); c.scale(240,240);
  const st=(STROKES[id]&&STROKES[id][case_[0]])||[];
  c.strokeStyle='#CBD5E1'; c.lineWidth=4/240; c.lineCap='round'; c.lineJoin='round';
  st.forEach(poly=>{ c.beginPath(); poly.forEach((p,i)=>{ i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); }); c.stroke(); });
  c.restore();
}
function animateStrokes(id,case_){
  const c=guideCtx();
  const st=(STROKES[id]&&STROKES[id][case_[0]])||[];
  let sIdx=0,pt=0;
  c.clearRect(0,0,300,300); c.save(); c.translate(30,30); c.scale(240,240);
  c.strokeStyle='var(--de-red)'; c.strokeStyle='#D9232E'; c.lineWidth=6/240; c.lineCap='round'; c.lineJoin='round';
  function step(){
    if(sIdx>=st.length){ c.restore(); return; }
    const poly=st[sIdx];
    c.beginPath(); c.moveTo(poly[0][0],poly[0][1]);
    for(let i=1;i<=pt&&i<poly.length;i++) c.lineTo(poly[i][0],poly[i][1]);
    c.stroke();
    pt++;
    if(pt>poly.length){ sIdx++; pt=0; }
    setTimeout(step,160);
  }
  step();
}
function redrawWrite(){
  const wc=document.getElementById('writeCanvas'); if(!wc) return;
  const c=wc.getContext('2d'); c.clearRect(0,0,300,300);
  c.strokeStyle='#0F1E36'; c.lineWidth=5; c.lineCap='round'; c.lineJoin='round';
  writeStrokes.forEach(poly=>{ if(poly.length<2) return; c.beginPath(); poly.forEach((p,i)=>{ i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); }); c.stroke(); });
}
function evalWrite(id){
  const out=document.getElementById('evalOut');
  if(!writeStrokes.length){ out.textContent='…'; return; }
  const strokes=writeStrokes.length;
  let totalLen=0; writeStrokes.forEach(poly=>{ for(let i=1;i<poly.length;i++){ totalLen+=Math.hypot(poly[i].x-poly[i-1].x,poly[i].y-poly[i-1].y); } });
  /* 3x3 coverage */
  const cells=new Set();
  writeStrokes.forEach(poly=>poly.forEach(p=>{ const gx=Math.min(2,Math.floor(p.x/100)), gy=Math.min(2,Math.floor(p.y/100)); cells.add(gx+'_'+gy); }));
  const cover=cells.size/9;
  let score=Math.min(100, Math.round(cover*60 + Math.min(20,strokes*8) + Math.min(20,totalLen/15)));
  state.writeCount++; persist();
  /* mark letter as learned if not yet */
  if(!state.letterState[id]) state.letterState[id]='learned';
  else if(state.letterState[id]==='new') state.letterState[id]='learned';
  persist();
  out.innerHTML='<b>'+t('m.evaluate')+': '+score+'/100</b> · '+t('m.strokes')+': '+strokes+' · '+t('m.cover')+': '+Math.round(cover*100)+'%';
  toast(t('m.saved'));
}

function doConvert(){

function redSet(cat){ const s={}; (cat.reds||[]).forEach(r=>s[r.key]=r); return s; }
function numTrans(key){
  /* translation layer from DE_NUM_WORDS / special */
  const k=String(Math.round(Number(key)));
  const w=DE_NUM_WORDS[k]; if(w) return tr6(w);
  return '';
}
function buildNumCells(cat){
  const box=document.querySelector('[data-cat="'+cat.id+'"]'); if(!box) return;
  const reds=redSet(cat); let cells=[];
  const push=(sym,de,isRed,note,trans)=>{ cells.push({sym:String(sym),de:de,red:!!isRed,note:note||'',trans:trans||numTrans(sym)}); };
  const kind=cat.kind;
  if(kind==='cardinal'){
    if(cat.cells==='0to12'){ for(let i=0;i<=12;i++) push(i,numberToGerman(i),reds[i]); }
    else if(cat.cells==='13to19'){ for(let i=13;i<=19;i++) push(i,numberToGerman(i),reds[i]); }
    else if(cat.cells==='tens20to90'){ [20,30,40,50,60,70,80,90].forEach(i=>push(i,numberToGerman(i),reds[i])); }
    else if(cat.cells==='21to99'){ for(let i=21;i<=99;i++) push(i,numberToGerman(i),reds[i]); }
    else if(cat.cells==='100to900'){ for(let i=1;i<=9;i++) push(i*100,numberToGerman(i*100),reds[i*100]); }
    else if(cat.cells==='1000to9000'){ for(let i=1;i<=9;i++) push(i*1000,numberToGerman(i*1000),reds[i*1000]); }
    else if(cat.cells==='scales'){
      push('10 000','zehntausend'); push('100 000','hunderttausend');
      push('1 000 000','eine Million',reds[1000000]);
      push('10 000 000','zehn Millionen'); push('100 000 000','hundert Millionen');
      push('1 000 000 000','eine Milliarde',reds[1000000000]);
      push('10 000 000 000','zehn Milliarden'); push('100 000 000 000','hundert Milliarden');
      push('1 000 000 000 000','eine Billion',reds[1000000000000]);
    }
  }
  else if(kind==='euro'){
    [['0,05','fünf Cent'],['1,00','ein Euro'],['1,50','ein Euro fünfzig'],
     ['2,50','zwei Euro fünfzig'],['4,50','vier Euro fünfzig',reds['euro']],
     ['9,95','neun Euro fünfundneunzig'],['10,00','zehn Euro'],
     ['19,99','neunzehn Euro neunundneunzig'],['20,00','zwanzig Euro'],
     ['49,99','neunundvierzig Euro neunundneunzig'],['50,00','fünfzig Euro'],
     ['99,99','neunundneunzig Euro neunundneunzig'],['100,00','hundert Euro'],
     ['199,99','einhundertneunundneunzig Euro neunundneunzig'],
     ['999,99','neunhundertneunundneunzig Euro neunundneunzig']]
     .forEach(c=>push('€'+c[0],c[1],c[2]));
    [10,20,25,30,50,75,100].forEach(p=>push(p+' %',numberToGerman(p)+' Prozent',reds['percent']));
  }
  else if(kind==='weekmonth'){
    DE_WEEKMONTH.weekdays.forEach(w=>push(w.de,w.de,false,'',tr6(w.tr6)));
    DE_WEEKMONTH.months.forEach(m=>push(m.de,m.de,false,'',tr6(m.tr6)));
  }
  else if(kind==='ordinalDay'){
    for(let i=1;i<=31;i++) push(i+'.',ordinalToGerman(i),reds[i]);
  }
  else if(kind==='time'){
    for(let h=1;h<=24;h++) push(h+':00',numberToGerman(h)+' Uhr');
    for(let m=1;m<=60;m++) push(':'+m,numberToGerman(m)+' Minuten');
    for(let h=1;h<=12;h++){ const next=(h%12)+1; push((h+1)+' vor '+next, 'halb '+numberToGerman(next),reds['halbdrei']); }
    for(let h=1;h<=12;h++){ const next=(h%12)+1; push((h)+':15','viertel '+numberToGerman(h),reds['halbdrei']); push((h)+':45','viertel vor '+numberToGerman(next),reds['halbdrei']); }
    DE_TIME_PHRASES.forEach(p=>push(p.h+':'+(p.m<10?'0':'')+p.m,p.de+' / '+p.formal,reds['halbdrei'],tr6(p.note6)));
  }
  else if(kind==='age'){
    for(let i=0;i<=100;i++) push(i,numberToGerman(i)+' Jahre alt',i===2?'':'');
    DE_FLOORS.forEach(f=>push('Floor '+f.n,f.de,false,'',tr6(f.tr6)));
    DE_EMERGENCY.forEach(e=>push(e.num,e.de,false,'',tr6(e.tr6)));
  }
  box.innerHTML=cells.map(c=>'<div class="num-cell'+(c.red?' red':'')+'">'+
    '<div class="num-sym">'+esc(c.sym)+'</div>'+
    '<div class="num-de">'+esc(c.de)+' <button class="btn btn-outline btn-sm" data-spk="'+esc(c.de)+'">🔊</button></div>'+
    (lyr('trans')&&c.trans?'<div class="num-trans">'+esc(c.trans)+'</div>':'')+
    (c.red&&c.note?'<div class="rule-note">⚠ '+esc(c.note)+'</div>':'')+'</div>').join('');
  box.querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>speak(b.getAttribute('data-spk')));
}

/* SRS: real spaced-repetition scheduling */
let srsFlip=false;
function todayNo(){ return Math.floor(Date.now()/86400000); }
function srsDueList(){
  const t=todayNo();
  return Object.keys(state.srs).map(k=>{ const c=state.srs[k]; c.key=k; c.due=c.due||t; c.ivl=c.ivl||1; return c; })
    .filter(c=>c.due<=t).sort((a,b)=>a.due-b.due);
}
function upsertWrong(q){
  const k=q.de;
  if(!state.srs[k]) state.srs[k]={front:q.de,back:tr6(q.expl6),due:todayNo(),ivl:1,ease:2.5};
  else { state.srs[k].back=tr6(q.expl6); state.srs[k].due=todayNo(); }
}
function renderSrs(){
  const pane=document.getElementById('srsPane');
  const due=srsDueList();
  const total=Object.keys(state.srs).length;
  pane.innerHTML='<p class="muted">'+t('srs.due')+': '+due.length+' / '+total+'</p>';
  if(!due.length){ pane.innerHTML+='<span class="banner-ok">✓ '+t('srs.done')+'</span>'; return; }
  const card=due[0];
  pane.innerHTML+='<div class="srs-card" id="srsCard" style="margin-top:10px;cursor:pointer">'+(srsFlip?esc(card.back):'<b>'+esc(card.front)+'</b><br><span class="muted">'+t('srs.flip')+'</span>')+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:10px">'+
    '<button class="btn btn-red btn-sm" id="sAgain">'+t('srs.again')+'</button>'+
    '<button class="btn btn-outline btn-sm" id="sGood">'+t('srs.good')+'</button>'+
    '<button class="btn btn-gold btn-sm" id="sEasy">'+t('srs.easy')+'</button></div>'+
    '<p class="muted" style="text-align:center;font-size:.78rem">Next: '+due.length+' cards · ivl='+card.ivl+'d</p>';
  document.getElementById('srsCard').onclick=()=>{ srsFlip=!srsFlip; renderSrs(); };
  const reschedule=(mode)=>{
    const c=state.srs[card.key]; if(!c){ srsFlip=false; renderSrs(); return; }
    const t=todayNo();
    if(mode==='again'){ c.due=t+0; c.ivl=1; }
    else if(mode==='good'){ c.ivl=Math.min(30,Math.max(c.ivl+1,Math.round(c.ivl*2))); c.due=t+c.ivl; }
    else { c.ivl=Math.min(30,Math.round(c.ivl*3)); c.due=t+c.ivl; }
    srsFlip=false; persist(); renderSrs();
  };
  document.getElementById('sAgain').onclick=()=>reschedule('again');
  document.getElementById('sGood').onclick=()=>reschedule('good');
  document.getElementById('sEasy').onclick=()=>reschedule('easy');
}
function renderFav(){
  const pane=document.getElementById('favPane');

  document.getElementById('expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='german-progress.json'; a.click();
  };
  document.getElementById('resetBtn').onclick=()=>{ if(confirm(t('reset.confirm'))){ Object.keys(localStorage).filter(k=>k.indexOf('gss.')===0).forEach(k=>localStorage.removeItem(k)); location.reload(); } };
}

/* ================= HEADER / WIRING ================= */
function renderHeaderLang(){
  const tr=document.getElementById('langTriggerBtn');
  const cur=SUPPORTED_LOCALES.find(l=>l.code===state.locale)||SUPPORTED_LOCALES[1];
  document.getElementById('activeLangFlag').textContent=cur.flag;
  document.getElementById('activeLangLabel').textContent=cur.name;
  const menu=document.getElementById('langMenuList');
  menu.innerHTML=SUPPORTED_LOCALES.map(l=>'<button class="lang-item'+(l.code===state.locale?' active':'')+'" data-lcode="'+l.code+'"><span>'+l.flag+' '+l.name+'</span><span>'+l.code+'</span></button>').join('');
  menu.querySelectorAll('[data-lcode]').forEach(b=>b.onclick=()=>{
    state.locale=b.getAttribute('data-lcode'); persist(); menu.classList.remove('open'); renderAll();
  });
}
function applyLayersUI(){
  document.getElementById('chkIpa').checked=lyr('ipa');
  document.getElementById('chkNative').checked=lyr('native');
  document.getElementById('chkActual').checked=lyr('actual');
  document.getElementById('chkTrans').checked=lyr('trans');
  document.getElementById('chkNotes').checked=lyr('notes');
  document.getElementById('lblIpa').textContent=t('layer.ipa');
  document.getElementById('lblNative').textContent=t('layer.native');
  document.getElementById('lblActual').textContent=t('layer.actual');
  document.getElementById('lblTrans').textContent=t('layer.trans');
  document.getElementById('lblNotes').textContent=t('layer.notes');
  document.getElementById('presetBeginner').textContent=t('preset.beginner');
  document.getElementById('presetAdvanced').textContent=t('preset.advanced');
  document.querySelectorAll('#spdGroup .spd-btn').forEach(b=>b.classList.toggle('active',parseFloat(b.dataset.spd)===state.speed));
  document.getElementById('darkToggleBtn').textContent=state.dark?'☀️':'🌙';
}
function route(){
  const h=curHash();
  if(h==='#/alphabet') renderAlphabet();
  else if(h==='#/numbers') renderNumbers();
  else if(h==='#/grammar') renderGrammar();
  else if(h==='#/quiz') renderQuiz();
  else renderHome();
  renderNav();
}
function renderAll(){
  bumpStreak();
  document.getElementById('uiAppTitle').textContent=t('nav.home').replace('🏠 ','')+' · Deutsch';
  renderHeaderLang(); applyLayersUI(); route();
}
/* guide + settings modals */
function openGuide(){
  const body=document.getElementById('guideModalBody');
  body.innerHTML='<h2>📖 '+t('guide.title')+'</h2><p style="white-space:pre-line">'+esc(t('hero.sub'))+'\n\n• 🔤 '+t('mod1.desc')+'\n• 🔢 '+t('mod2.desc')+'\n• 📘 '+t('mod3.desc')+'\n• 🎯 '+t('mod4.desc')+'\n\nℹ️ '+esc(t('m.score'))+'\n'+esc(t('tts.note'))+'</p>';
  document.getElementById('guideModal').classList.add('open');
}
function openSettings(){
  const body=document.getElementById('settingsModalBody');
  body.innerHTML='<h2>⚙️ '+t('settings.title')+'</h2>'+
    '<p class="muted" style="margin:8px 0">'+t('goal.title')+': '+state.goal+' min</p><div class="row">'+
    [5,10,15,30].map(m=>'<button class="btn btn-outline btn-sm" data-setgoal="'+m+'">'+t('goal.min'+m)+'</button>').join('')+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn btn-red" id="setReset">↺ '+t('reset.btn')+'</button></div>';
  document.getElementById('settingsModal').classList.add('open');
  body.querySelectorAll('[data-setgoal]').forEach(b=>b.onclick=()=>{ state.goal=parseInt(b.dataset.setgoal,10); persist(); toast(t('reset.done')||'saved'); });
  document.getElementById('setReset').onclick=()=>{ if(confirm(t('reset.confirm'))){ Object.keys(localStorage).filter(k=>k.indexOf('gss.')===0).forEach(k=>localStorage.removeItem(k)); location.reload(); } };
}
function init(){
  /* logo */
  const slot=document.getElementById('headerLogoSlot');
  const fb='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><rect width="44" height="44" rx="9" fill="#0F1E36"/><rect x="8" y="12" width="28" height="6" fill="#D9232E"/><rect x="8" y="19" width="28" height="6" fill="#F2A918"/><text x="22" y="37" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">DE</text></svg>');
  const img=document.createElement('img');
  img.alt='logo'; img.onerror=function(){ this.onerror=null; this.src=fb; };
  img.src=fb;
  if(typeof navigator!=='undefined'&&navigator.onLine) img.src='https://lh3.googleusercontent.com/d/1k_rcRMTIFGacnMq1xdcENw5OHNVib_2d';
  slot.appendChild(img);
  /* header events */
  document.getElementById('langTriggerBtn').onclick=(e)=>{ e.stopPropagation(); document.getElementById('langMenuList').classList.toggle('open'); };
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.lang-picker')) document.getElementById('langMenuList').classList.remove('open'); });
  document.getElementById('brandHomeBtn').onclick=()=>{ location.hash='#/home'; };
  document.getElementById('guideBtn').onclick=openGuide;
  document.getElementById('settingsBtn').onclick=openSettings;
  document.getElementById('darkToggleBtn').onclick=()=>{ state.dark=!state.dark; document.documentElement.classList.toggle('dark',state.dark); persist(); applyLayersUI(); };
  document.querySelectorAll('#spdGroup .spd-btn').forEach(b=>b.onclick=()=>{ state.speed=parseFloat(b.dataset.spd); persist(); applyLayersUI(); });
  /* layers */
  const bindChk=(id,key)=>{ document.getElementById(id).onchange=(e)=>{ state.layers[key]=e.target.checked; persist(); route(); }; };
  bindChk('chkIpa','ipa'); bindChk('chkNative','native'); bindChk('chkActual','actual'); bindChk('chkTrans','trans'); bindChk('chkNotes','notes');
  document.getElementById('presetBeginner').onclick=()=>{ state.layers={ipa:true,native:true,actual:true,trans:true,notes:true}; persist(); applyLayersUI(); route(); };
  document.getElementById('presetAdvanced').onclick=()=>{ state.layers={ipa:true,native:false,actual:false,trans:false,notes:false}; persist(); applyLayersUI(); route(); };
  /* modals close */
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));
  document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',(e)=>{ if(e.target===m) m.classList.remove('open'); }));
  /* router */
  window.addEventListener('hashchange',route);
  /* dark apply */
  document.documentElement.classList.toggle('dark',state.dark);
  /* studied timer: accumulate while open */
  setInterval(()=>{ state.studiedSec++; persist(); },60000);
  /* preload voices */
  if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=()=>{ cachedVoice=null; pickGermanVoice(); }; }
  renderAll();
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
